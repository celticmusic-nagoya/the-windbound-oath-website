name: Stage approved companions (one-time)
on:
  push:
    branches: [feature/companions-art-02-approved]
    paths: [.github/workflows/stage-companions-art-02.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download approved originals and generate website WebP
        shell: bash
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          import hashlib, io, pathlib, urllib.request
          from PIL import Image
          commit = '892505cf5443f7b6af05b7e4c7bebf94b0916a17'
          files = [
              ('bram','assets/companions/bram/master/bram-full-body.png','ba0d08a30738ab0e156c680f3fb3b1c98644fd12528ace991db84515275c869b'),
              ('liam','assets/companions/liam/source/liam_idle.png','0900dc7beddf71939b7e38ec50632ce9b0654ced240f7858548794d3e68cb445'),
          ]
          dest = pathlib.Path('assets/companions')
          dest.mkdir(parents=True, exist_ok=True)
          for name, path, expected in files:
              url = f'https://raw.githubusercontent.com/celticmusic-nagoya/the-windbound-oath/{commit}/{path}'
              with urllib.request.urlopen(url, timeout=60) as response:
                  data = response.read()
              digest = hashlib.sha256(data).hexdigest()
              if digest != expected:
                  raise RuntimeError(f'SHA-256 mismatch for {name}: {digest}')
              image = Image.open(io.BytesIO(data)).convert('RGBA')
              out = dest / f'{name}.webp'
              image.save(out, 'WEBP', quality=86, method=6)
              verified = Image.open(out)
              verified.load()
              print(name, image.size, 'source_sha256', digest, 'webp_sha256', hashlib.sha256(out.read_bytes()).hexdigest(), 'bytes', out.stat().st_size)
          PY
      - name: Commit generated WebP assets to feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/companions/bram.webp assets/companions/liam.webp
          git diff --cached --quiet || (git commit -m "assets(site): add approved Bram and Liam WebP" && git push)
