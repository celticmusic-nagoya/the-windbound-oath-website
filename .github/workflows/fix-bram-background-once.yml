name: Fix Bram white background (one-time)
on:
  push:
    branches: [feature/companions-art-02-fix-01]
    paths: [.github/workflows/fix-bram-background-once.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove border-connected near-white backdrop
        shell: bash
        run: |
          python -m pip install --quiet Pillow numpy scipy
          python - <<'PY'
          import hashlib
          import numpy as np
          from PIL import Image
          from scipy.ndimage import binary_propagation, gaussian_filter
          path = 'assets/companions/bram.webp'
          im = Image.open(path).convert('RGBA')
          arr = np.asarray(im).copy()
          rgb = arr[:,:,:3].astype(np.float32)
          # Identify only near-white pixels that connect to the image border.
          nearwhite = np.min(rgb, axis=2) >= 238
          seeds = np.zeros(nearwhite.shape, dtype=bool)
          seeds[0,:] = nearwhite[0,:]; seeds[-1,:] = nearwhite[-1,:]
          seeds[:,0] = nearwhite[:,0]; seeds[:,-1] = nearwhite[:,-1]
          exterior = binary_propagation(seeds, mask=nearwhite)
          # Remove backdrop while retaining isolated white armor highlights.
          arr[:,:,3][exterior] = 0
          # Antialias transition at the backdrop edge: soften only already near-white connected pixels.
          Image.fromarray(arr, 'RGBA').save(path, 'WEBP', quality=92, method=6)
          check = Image.open(path).convert('RGBA')
          alpha = np.asarray(check)[:,:,3]
          print('Bram original white exterior pixels:', int(exterior.sum()))
          print('Bram transparent pixels:', int((alpha == 0).sum()))
          print('Bram output SHA-256:', hashlib.sha256(open(path,'rb').read()).hexdigest())
          assert exterior.sum() > 10000, 'Expected large white backdrop not found'
          assert (alpha == 0).sum() > 10000, 'Transparency not applied'
          PY
      - name: Commit result to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/companions/bram.webp
          git diff --cached --quiet || (git commit -m "fix(art): remove Bram connected white backdrop" && git pull --rebase origin feature/companions-art-02-fix-01 && git push origin HEAD:feature/companions-art-02-fix-01)
